      <th>Ta réponse</th>
    </tr>
  </thead>

    <tr>
      <td><strong>Constat</strong></td>
      <td>Quel fait précis pose problème ?</td>

    </tr>
    <tr>
      <td><strong>Argument</strong></td>
      <td>Pourquoi est-ce important pour tout le monde ?</td>
      <td><textarea rows="2" aria-label="Argument"></textarea></td>
    </tr>
    <tr>
      <td><strong>Proposition</strong></td>
      <td>Qu'est-ce que je propose de faire, et quand ?</td>
      <td><textarea rows="2" aria-label="Proposition"></textarea></td>
    </tr>
  </tbody>
</table>
