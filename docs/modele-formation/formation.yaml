# ============================================================
#  MODÈLE DE FORMATION (une formation = plusieurs cours)
#  1. Copie ce dossier dans formations/ et renomme-le (ex. formations/ma-formation)
#     → adresse : /formations/ma-formation/
#  2. Remplis ce fichier, puis crée un dossier par cours dans cours/
#     (copie cours/modele-de-cours/ et renomme-le).
# ============================================================

nom: Nom de la formation
resume: Une ou deux phrases qui donnent envie.
image: images/couverture.png          # facultatif (dossier images/ de la formation)

niveau: debutant                      # debutant | intermediaire | avance
themes: [Thème 1, Thème 2]            # servent aux filtres du catalogue

dependances: []                       # formations à suivre avant (noms de dossier)

cours:                                # ordre des cours (noms des dossiers dans cours/)
  - modele-de-cours                   # facultatif : sinon ordre alphabétique

date_ajout: 2026-01-01                # « Nouveau » pendant 45 jours
popularite:                           # facultatif, saisi à la main
  suivis: 0
  note: 0                             # sur 5

# Le temps total et la modalité de la formation sont calculés à partir de ses cours.
# Le dossier styles/ de la formation s'applique à la formation ET à tous ses cours.
